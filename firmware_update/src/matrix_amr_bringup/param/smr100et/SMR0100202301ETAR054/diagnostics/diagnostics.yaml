debug: false

# sensor_msgs::LaserScan
check_ldsf: true
ldsf_topic: "/scan"

# sensor_msgs::LaserScan
check_ldsr: false
ldsr_topic: ""

# sensor_msgs::Imu
check_imu: true
imu_topic: "imu/data"

# sensor_msgs::BatteryState
check_bms_base: true
bms_base_topic: "/battery_state"

# sensor_msgs::BatteryState
check_bms_plugin: false
bms_plugin_topic: ""

# sensor_msgs::PointCloud2
check_cam1: false
cam1_topic: ""

# sensor_msgs::PointCloud2
check_cam2: false
cam2_topic: ""

# sensor_msgs::PointCloud2
check_cam3: false
cam3_topic: ""

# sensor_msgs::PointCloud2
check_cam_rear: false
cam_rear_topic: ""

# std_msgs::Int8
check_motor: true
motor_topic: "/matrix_controller/heart_beat"

# std_msgs::Int8
check_mcu1: true
mcu1_topic: "/matrix_controller/heart_beat"

# std_msgs::Int8
check_mcu2: true
