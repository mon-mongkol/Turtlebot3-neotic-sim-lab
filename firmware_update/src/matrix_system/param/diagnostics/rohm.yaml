
use_automatic_shutdown: true
timeout_noaction_shutdown: 10800 #sec
timeout_full_charge_shutdown: 600 #sec

use_diagnostics: true
timeout_error_device: 10 #sec

debug: false

# sensor_msgs::LaserScan
check_ldsf: true
ldsf_topic: "/scan_f_raw"

# sensor_msgs::LaserScan
check_ldsr: true
ldsr_topic: "/scan_r_raw"

# sensor_msgs::Imu
check_imu: true
imu_topic: "/imu/data"

# sensor_msgs::BatteryState
check_bms: false
bms_topic: "/battery_state"

# sensor_msgs::PointCloud2
check_cam1: false
cam1_topic: "/depth_cam_mount_point/depth/color/points"

# sensor_msgs::PointCloud2
check_cam2: false
cam2_topic: ""

# nav_msgs::Odometry
check_motor: false
motor_topic: ""

# std_msgs::Int8
check_mcu1: true
mcu1_topic: "/matrix_controller/heart_beat"

# std_msgs::Int8
check_mcu2: true
mcu2_topic: "/matrix_io/heart_beat"