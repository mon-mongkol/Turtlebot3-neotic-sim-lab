global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  static_map: true
  rolling_window: false
  resolution: 0.05
  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.5


  plugins:
  - {name: static_layer,    type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
  - {name: ist_costmap_prohibition_layer, type: "costmap_prohibition_layer_namespace::CostmapProhibitionLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: scan
    scan:
      sensor_frame: base_scan
      data_type: LaserScan
      topic: scan
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 3.5

  inflation_layer:
    inflation_radius: 0.55
    cost_scaling_factor: 3.0



  ist_costmap_prohibition_layer:
    enabled: true
    fill_polygons: true
    dynamic_polygons: true
    #prohibition_cost: 254   # lower = softer obstacle, 254 = absolute block
    prohibition_areas:
    # A wall (line with 2 points)
      - []
      #- [[2.0, 1.0], [2.0, 5.0]]
      # A rectangular prohibited zone (polygon with 4 points)
      #- [[5.0, 5.0], [7.0, 5.0], [7.0, 7.0], [5.0, 7.0]]


 
