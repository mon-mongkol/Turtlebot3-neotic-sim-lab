# ============================================================
#  move_base parameters — TEB Local Planner for TurtleBot3
# ============================================================

# Use TEB as the local planner
base_global_planner: SBPLLatticePlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS

# Alternative global planners:
#base_global_planner: navfn/NavfnROS
#base_global_planner: global_planner/GlobalPlanner

# Controller frequency (Hz)
controller_frequency: 10.0
controller_patience: 15.0

# Planner frequency (Hz) — how often the global plan is recomputed
planner_frequency: 1.0
planner_patience: 5.0

# Oscillation
oscillation_timeout: 10.0
oscillation_distance: 0.2

# Recovery behaviors
clearing_rotation_allowed: true
recovery_behavior_enabled: true
shutdown_costmaps: false
